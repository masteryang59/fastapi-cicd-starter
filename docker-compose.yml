# Local run of the production image against PostgreSQL:  docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shortlinks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shortlinks"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: fastapi-cicd-starter:local
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-compose}
      DATABASE_URL: postgresql://app:app@db:5432/shortlinks
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true          # same constraint as Lambda: only /tmp is writable
    tmpfs:
      - /tmp

volumes:
  pgdata:
encode_token:
  enabled: true
check_health:
  enabled: true
encode_token:
  enabled: true
compress_payload:
  enabled: true