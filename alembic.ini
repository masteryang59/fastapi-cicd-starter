# Used by the `alembic` CLI (e.g. `uv run alembic revision --autogenerate -m "..."`).
# The app itself configures Alembic in code (app/schema.py) and never reads this file.
# The database URL comes from DATABASE_URL (see app/migrations/env.py).
[alembic]
script_location = %(here)s/app/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
